name: CI

# Lint and run the test suite (scheduler, service, API, and export) on every
# push and pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project and dev tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Run tests
        run: make test
