[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overpass"
version = "0.1.0"
description = "Schedule satellite-to-ground-station contacts without double-booking an antenna."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The scheduler core runs on the standard library alone. The API and database
# dependencies arrive in a later stage.
dependencies = []

[project.optional-dependencies]
# The API layer (FastAPI + SQLAlchemy + JWT). Kept optional so the scheduler
# core can be installed on its own.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
]
# Drivers for running against Postgres instead of the default SQLite.
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
overpass = "overpass.cli:main"
overpass-seed = "overpass.seed:main"
overpass-export = "overpass.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() and pydantic's Field() are meant to be argument
# defaults; that's idiomatic, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "pydantic.Field"]
