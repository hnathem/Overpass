[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overpass"
version = "0.1.0"
description = "Schedule satellite-to-ground-station contacts without double-booking an antenna."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The scheduler core runs on the standard library alone. The API and database
# dependencies arrive in a later stage.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
overpass = "overpass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
